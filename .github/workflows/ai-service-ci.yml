name: AI Service CI

on:
  push:
    paths:
      - "app/**"
      - "tests/**"
      - "migrations/**"
      - "scripts/**"
      - "tools/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - ".coveragerc"
      - ".github/workflows/ai-service-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "migrations/**"
      - "scripts/**"
      - "tools/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - ".coveragerc"
      - ".github/workflows/ai-service-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_service_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_service_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:3-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ai_service_test
      REDIS_URL: redis://localhost:6379/15
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/
      INTERNAL_API_TOKEN: ci-only-test-token
      GEMINI_API_KEY: ""
      OPENROUTER_API_KEY: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Compile Python source
        run: python -m compileall -q app tests scripts tools

      - name: Run correctness lint rules
        run: ruff check app tests scripts tools

      - name: Report current type-check baseline
        continue-on-error: true
        run: mypy app

      - name: Run tests with coverage
        run: >-
          pytest
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=60

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-service-coverage
          path: artifacts/coverage/coverage.xml
          if-no-files-found: warn
