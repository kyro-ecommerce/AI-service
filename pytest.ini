[pytest]
testpaths = tests tools/catalog_ingestion/tests
timeout = 120
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
addopts = --strict-markers --strict-config
markers =
    mocked_contract: API/handler contract checks with test doubles, not real-service integration
    integration: requires PostgreSQL, Redis, RabbitMQ, or another service
    performance: measures latency or throughput and is not a unit test
