services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_service
    ports:
      - "5433:5432"   # Changed from 5432 to avoid conflict with kyro_backend compose
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_service"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ai_rabbitmq
    restart: always
    ports:
      - "5673:5672"    # Changed from 5672 to avoid conflict with kyro_backend compose
      - "15673:15672"  # Changed from 15672 to avoid conflict with kyro_backend compose
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_redis
    restart: always
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: ai_service_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/ai_service
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - REDIS_URL=redis://redis:6379/0
      - CATALOG_SERVICE_URL=${CATALOG_SERVICE_URL_IN_DOCKER:-http://host.docker.internal:8080}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - CHAT_RATE_LIMIT_REQUESTS=${CHAT_RATE_LIMIT_REQUESTS:-20}
      - CHAT_RATE_LIMIT_WINDOW_SECONDS=${CHAT_RATE_LIMIT_WINDOW_SECONDS:-60}
      - LLM_REQUEST_TIMEOUT_SECONDS=${LLM_REQUEST_TIMEOUT_SECONDS:-8}
      - LLM_TOTAL_BUDGET_SECONDS=${LLM_TOTAL_BUDGET_SECONDS:-12}
      - LLM_MAX_OUTPUT_TOKENS=${LLM_MAX_OUTPUT_TOKENS:-768}
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/ai/live"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  adminer:
    image: adminer:latest
    container_name: ai_db_adminer
    restart: always
    ports:
      - "8090:8080"  # Changed from 8080 to avoid conflict with api-gateway
    depends_on:
      - db

volumes:
  pgdata:
